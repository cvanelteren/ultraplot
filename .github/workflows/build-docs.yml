name: Build docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: mamba-org/setup-micromamba@v2.0.3
        with:
          environment-file: ./docs/environment.yml
      - name: "Build docs"
        shell: bash -el {0}
        run: |
          micromamba activate ultraplot-docs
          micromamba install -f ./docs/environment.yml
          pip install .
          cd docs
          make html
